name: Sign sandbox artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published artifact version to sign (without a leading v)
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign published image and kit artifacts
        env:
          COSIGN_YES: "true"
          VERSION: ${{ inputs.version }}
        run: |
          for artifact in phi-sandbox phi-kit phi-claude-kit phi-codex-kit phi-cursor-kit; do
            ref="ghcr.io/nelsonkam/$artifact:$VERSION"
            digest="sha256:$(docker buildx imagetools inspect "$ref" --raw | sha256sum | cut -d ' ' -f 1)"
            cosign sign "$ref@$digest"
          done
