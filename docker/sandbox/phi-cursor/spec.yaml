schemaVersion: "2"
kind: mixin
name: phi-cursor
version: 0.2.12
displayName: Phi Cursor network policy
description: Cursor service egress for Phi
requires:
  agent: phi

permissions:
  network:
    allow:
      - api2.cursor.sh
      - api3.cursor.sh
      - repo42.cursor.sh
      - '*.cursor.sh'
      - api.cursor.com
      - cursor.com
      - '*.cursor.com'
